<section id="contact" class="relative py-24 sm:py-28">
  <div class="container-px">
    <div appReveal class="noise surface-card relative overflow-hidden px-6 py-14 text-center sm:px-12 sm:py-20">
      <div class="pointer-events-none absolute inset-0 -z-10">
        <div class="absolute -left-16 -top-16 h-64 w-64 rounded-full bg-violet-600/30 blur-[100px]"></div>
        <div class="absolute -bottom-16 -right-16 h-64 w-64 rounded-full bg-cyan-500/25 blur-[100px]"></div>
      </div>

      <span class="chip mx-auto">
        <span class="h-1.5 w-1.5 rounded-full bg-violet-400"></span>
        {{ i18n.t('contact.kicker') }}
      </span>

      <h2 class="mx-auto mt-5 max-w-2xl font-display text-3xl font-bold sm:text-5xl">
        {{ i18n.t('contact.title') }}
      </h2>

      <p class="mx-auto mt-5 max-w-xl text-base leading-relaxed text-slate-400">
        {{ i18n.t('contact.cta') }}
      </p>

      <div class="mt-9 flex flex-wrap justify-center gap-3">
        <a [href]="person.linkedin" target="_blank" rel="noopener" class="btn-neon">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21h-4V9Z"
            />
          </svg>
          {{ i18n.t('contact.linkedin') }}
        </a>

        @if (person.email) {
          <a [href]="'mailto:' + person.email" class="btn-ghost">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16v12H4z" stroke-linejoin="round" />
              <path d="m4 7 8 6 8-6" stroke-linejoin="round" />
            </svg>
            {{ i18n.t('contact.email') }}
          </a>
        }
      </div>

      <p class="mt-8 inline-flex items-center gap-2 text-sm text-slate-500">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11Z" stroke-linejoin="round" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        {{ i18n.lang() === 'pt' ? person.location.pt : person.location.en }}
      </p>
    </div>
  </div>
</section>
